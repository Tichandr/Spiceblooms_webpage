<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6B35">
  <meta name="description" content="Spiceblooms Naturals — connect with us.">
  <title>Spiceblooms Naturals | Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B35;
      --secondary: #F7931E;
      --accent: #FFB800;
      --green: #203E2C;
      --dark: #2D2D2D;
      --light: #F8F9FA;
      --muted: #6b7280;
      --white: #ffffff;
      --shadow: 0 22px 60px rgba(45, 45, 45, .14);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Poppins", sans-serif;
      color: var(--dark);
      background: #2D2D2D;
    }

    .bg-video-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #2D2D2D;
    }

    .bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      object-position: center;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: rgba(45, 45, 45, 0.22);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 440px);
      margin: 0 auto;
      padding: 28px 18px;
    }

    .card {
      overflow: hidden;
      background: #fff;
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 28px 4px;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(82%, 280px);
      height: auto;
      margin: 0 auto;
      object-fit: contain;
      object-position: center;
      background: transparent;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .links {
      padding: 10px 18px 18px;
    }

    .links-title {
      margin: 0 0 14px;
      text-align: center;
      color: var(--green);
      font-family: "Poppins", sans-serif;
      font-size: 16px;
      font-weight: 600;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 62px;
      margin: 11px 0;
      padding: 10px 14px;
      color: var(--dark);
      text-decoration: none;
      background: var(--light);
      border: 1px solid rgba(255, 107, 53, .10);
      border-radius: 17px;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .link:active { transform: scale(.985); }

    @media (hover:hover) {
      .link:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 107, 53, .45);
        box-shadow: 0 8px 20px rgba(255, 107, 53, .12);
      }
    }

    .icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(135deg, #FF6B35 0%, #F7931E 50%, #FFB800 100%);
    }

    .icon svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .instagram .icon {
      background: linear-gradient(45deg, #f58529, #dd2a7b 50%, #8134af);
    }

    .youtube .icon { background: #FF0000; }
    .x .icon { background: #2D2D2D; }

    .link-copy {
      min-width: 0;
      flex: 1;
    }

    .link-name {
      display: block;
      font-weight: 600;
      font-size: 15px;
      color: var(--dark);
    }

    .link-url {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .arrow {
      color: var(--primary);
      font-size: 22px;
      line-height: 1;
      font-weight: 500;
    }

    .story {
      margin: 4px 18px 22px;
      padding: 18px;
      text-align: center;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255, 107, 53, .10), rgba(255, 184, 0, .14));
    }

    .story strong {
      display: block;
      color: var(--dark);
      font-family: "Poppins", sans-serif;
      font-size: 16px;
      font-weight: 600;
    }

    .story span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
    }

    footer {
      padding: 0 18px 22px;
      text-align: center;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .4px;
      font-weight: 400;
    }

    @media (max-width: 360px) {
      .page { padding: 12px 10px 18px; }
      .hero { padding: 16px 16px 2px; }
      .logo { width: min(88%, 230px); }
      .links { padding: 8px 12px 14px; }
      .link { min-height: 58px; padding: 9px 11px; }
      .link-url { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
</head>

<body>
  <div class="bg-video-wrap" aria-hidden="true">
    <video class="bg-video" autoplay muted loop playsinline preload="auto">
      <source src="assets/connectpage.mp4" type="video/mp4">
      <source src="assets/connectpage.mov" type="video/quicktime">
    </video>
  </div>
  <div class="bg-overlay"></div>

  <main class="page">
    <section class="card">

      <header class="hero">
        <h1 class="visually-hidden">Spiceblooms Naturals</h1>
        <img class="logo" src="assets/spiceblooms-naturals-logo.png" alt="Spiceblooms Naturals" width="1024" height="1024">
      </header>

      <section class="links" aria-label="Spiceblooms links">
        <h2 class="links-title">Connect With Us</h2>

        <a class="link website" href="https://www.spiceblooms.in/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M2 12h20"></path>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </span>
          <span class="link-copy">
            <span class="link-name">Visit Our Website</span>
            <span class="link-url">spiceblooms.in</span>
          </span>
          <span class="arrow">›</span>
        </a>

        <a class="link instagram" href="https://www.instagram.com/spiceblooms_naturals/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5A4.25 4.25 0 0 0 20.5 16.25v-8.5A4.25 4.25 0 0 0 16.25 3.5zm4.25 3.25a5.25 5.25 0 1 1 0 10.5 5.25 5.25 0 0 1 0-10.5zm0 1.5a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5zM17.5 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
          </span>
          <span class="link-copy">
            <span class="link-name">Instagram</span>
            <span class="link-url">@spiceblooms_naturals</span>
          </span>
          <span class="arrow">›</span>
        </a>

        <a class="link youtube" href="https://youtube.com/@spicebloomsbiz" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8zM9.75 15.5v-7l6.2 3.5-6.2 3.5z"/>
            </svg>
          </span>
          <span class="link-copy">
            <span class="link-name">YouTube</span>
            <span class="link-url">@spicebloomsbiz</span>
          </span>
          <span class="arrow">›</span>
        </a>

        <a class="link x" href="https://x.com/spiceblooms" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.244 2H21.5l-7.5 8.57L22.5 22h-6.59l-5.16-6.75L5.2 22H1.94l8.03-9.17L1.5 2h6.75l4.66 6.18L18.244 2zm-1.16 18h1.8L7.01 3.91H5.08L17.084 20z"/>
            </svg>
          </span>
          <span class="link-copy">
            <span class="link-name">X</span>
            <span class="link-url">@spiceblooms</span>
          </span>
          <span class="arrow">›</span>
        </a>
      </section>

      <div class="story">
        <strong>Scan. Discover. Enjoy.</strong>
        <span>Thank you for choosing Spiceblooms Naturals.</span>
      </div>

      <footer>© Spiceblooms Naturals</footer>
    </section>
  </main>
  <script>
    const bgVideo = document.querySelector('.bg-video');
    if (bgVideo) {
      bgVideo.play().catch(() => {});
    }
  </script>
</body>
</html>
